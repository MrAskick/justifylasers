import groovy.json.JsonOutput
import java.awt.image.BufferedImage
import javax.imageio.ImageIO

// Optional UV authoring task. Normal builds use the packed atlas, never these source sheets.
tasks.register('generateLightBridgeMaterials') {
    def folder = rootProject.file('ref/Blocks/LightBridge')
    def destination = layout.buildDirectory.dir('generated/lightBridgeMaterials')
    inputs.files((1..3).collect { new File(folder, "1x${it}_LightBridge_UV.png") })
    inputs.file(rootProject.file('gradle/light-bridge-materials.gradle'))
    outputs.dir(destination)
    doLast {
        def sheets = (1..3).collectEntries { [(it): ImageIO.read(new File(folder, "1x${it}_LightBridge_UV.png"))] }
        def parts = [
            metal:[sheet:2,r:[560,201,500,21],s:[192,24]],
            armor:[sheet:3,r:[956,141,245,46],s:[128,24]],
            port:[sheet:2,r:[14,193,322,322],s:[160,160],glow:true],
            aperture1:[sheet:1,r:[736,528,181,228],s:[96,120],glow:true,aperture:true],
            aperture2:[sheet:2,r:[436,255,911,194],s:[224,48],glow:true,aperture:true],
            aperture3:[sheet:3,r:[570,300,1000,123],s:[288,40],glow:true,aperture:true],
            core:[sheet:2,r:[680,320,150,48],s:[64,24],glow:true,aperture:true],
            strip:[sheet:2,r:[232,41,21,113],s:[20,96],glow:true,aperture:true]
        ]
        int size = 512, x0 = 4, y0 = 4, row = 0
        def layers = ['base','base_n','base_s','glow','glow_n','glow_s','indicator','indicator_n','indicator_s']
                .collectEntries { [(it):new BufferedImage(size,size,BufferedImage.TYPE_INT_ARGB)] }
        def regions = [:]
        parts.each { name, spec ->
            int width = spec.s[0], height = spec.s[1]
            if (x0 + width + 4 > size) { x0 = 4; y0 += row + 8; row = 0 }
            if (y0 + height + 4 > size) throw new GradleException('Hard light emitter atlas overflow')
            regions[name] = [x0,y0,width,height]
            for (int y = -4; y < height + 4; y++) for (int x = -4; x < width + 4; x++) {
                double u = (Math.max(0,Math.min(width-1,x))+.5)/width
                double v = (Math.max(0,Math.min(height-1,y))+.5)/height
                // Shared trims must have the same edge tone after a 90/180-degree turn.
                if (name == 'metal' || name == 'armor') { u = .18 + .64 * Math.abs(u * 2 - 1); v = .18 + .64 * Math.abs(v * 2 - 1) }
                def rect = spec.r
                int pixel = sheets[spec.sheet].getRGB(rect[0]+(int)(u*rect[2]),rect[1]+(int)(v*rect[3]))
                int r = pixel>>16&255, g = pixel>>8&255, b = pixel&255
                int peak = Math.max(r,Math.max(g,b))
                boolean luminous = spec.aperture || spec.glow && g-r > 34 && b-r > 45
                int strength = luminous ? peak : 0
                if (luminous) { r = (int)(peak*0.12); g = r; b = r+4 }
                int px=x0+x, py=y0+y
                layers.base.setRGB(px,py,(int)0xFF000000L|r<<16|g<<8|b)
                layers.base_s.setRGB(px,py,(int)(name=='armor'?0xFF703000L:0xFF805000L))
                ['base_n','glow_n','indicator_n'].each { layers[it].setRGB(px,py,(int)0xFF7F7FFFL) }
                ['glow','indicator'].each { layers[it].setRGB(px,py,strength<<24|strength<<16|strength<<8|strength) }
                layers.glow_s.setRGB(px,py,((int)(strength*0.9)<<24)|0x602000)
                layers.indicator_s.setRGB(px,py,(int)0xFF602000L)
            }
            x0 += width+8; row = Math.max(row,height)
        }
        def output = destination.get().asFile
        output.mkdirs()
        layers.each { name, image -> ImageIO.write(image,'png',new File(output,name+'.png')) }
        def armor = regions.armor
        ImageIO.write(layers.base.getSubimage(armor[0],armor[1],armor[2],armor[3]),'png',new File(output,'particle.png'))
        new File(output,'base.json').setText(JsonOutput.toJson([size:size,regions:regions])+'\n','UTF-8')
    }
}
