import groovy.json.JsonOutput
import java.awt.image.BufferedImage
import javax.imageio.ImageIO

tasks.register('generatePrintWhiteTexture') {
    doLast {
        def white = new BufferedImage(16, 16, BufferedImage.TYPE_INT_ARGB)
        for (int y = 0; y < 16; y++) for (int x = 0; x < 16; x++) white.setRGB(x, y, (int)0xFFFFFFFFL)
        ImageIO.write(white, 'png', rootProject.file('src/main/resources/assets/justifylasers/textures/block/print_white.png'))
    }
}

// Optional repacking of the CC0 OpenComputers printer sprites. Runtime builds use the finished atlases.
tasks.register('generatePrintingMaterials') {
    dependsOn 'generatePrintWhiteTexture'
    doLast {
        def side=ImageIO.read(rootProject.file('src/main/materials/opencomputers/printer_side.png'))
        def top=ImageIO.read(rootProject.file('src/main/materials/opencomputers/printer_top.png'))
        def patches=[armor:[top,0,0,16,16],dark:[side,4,4,8,6],metal:[top,1,1,1,12],
                     column:[top,1,1,2,12],joint:[top,0,0,4,4],grill:[side,2,10,12,4],
                     lid:[top,0,0,16,16],front:[side,0,0,16,16],screen:[side,4,4,8,6],
                     light:[null,0,0,2,2],side:[side,0,0,16,16],latch:[top,6,6,4,4]]
        ['photopolymer_printer','loot_collector'].each { kind ->
            int size=128
            def maps=['base','base_n','base_s','glow','glow_n','glow_s','indicator','indicator_n','indicator_s'].collectEntries { [(it):new BufferedImage(size,size,BufferedImage.TYPE_INT_ARGB)] }
            def regions=[:];int index=0
            patches.each { part,spec ->
                int px=4+(index%4)*28,py=4+(int)(index/4)*28,w=spec[3],h=spec[4];index++
                regions[part]=[px,py,w,h]
                for(int y=-2;y<h+2;y++)for(int x=-2;x<w+2;x++){
                    int pixel=spec[0]==null?(int)0xFF303844L:spec[0].getRGB(spec[1]+Math.max(0,Math.min(w-1,x)),spec[2]+Math.max(0,Math.min(h-1,y)))
                    int r=pixel>>16&255,g=pixel>>8&255,b=pixel&255
                    // The old green status LEDs become neutral; our separate mask supplies the beam color.
                    if(g>r+15 && g>b+15){int grey=(r+g+b)/3;pixel=(int)0xFF000000L|grey<<16|grey<<8|grey}
                    int dx=px+x,dy=py+y;boolean lit=part=='light'
                    maps.base.setRGB(dx,dy,pixel)
                    maps.base_s.setRGB(dx,dy,(int)0xFF509000L)
                    ['base_n','glow_n','indicator_n'].each{maps[it].setRGB(dx,dy,(int)0xFF7F7FFFL)}
                    ['glow','indicator'].each{maps[it].setRGB(dx,dy,lit?(int)0xFFFFFFFFL:0)}
                    maps.glow_s.setRGB(dx,dy,lit?(int)0xDC602000L:0)
                    maps.indicator_s.setRGB(dx,dy,(int)0xFF602000L)
                }
            }
            regions.putAll([beam:regions.column,core:regions.joint,ring:regions.metal,steel:regions.metal,glass:regions.dark])
            def output=rootProject.file('src/main/resources/assets/justifylasers/textures/component/'+kind);output.mkdirs()
            maps.each{key,img->ImageIO.write(img,'png',new File(output,key+'.png'))}
            new File(output,'base.json').setText(JsonOutput.toJson([size:size,regions:regions])+'\n','UTF-8')
            ImageIO.write(top,'png',new File(output,'particle.png'))
            def particle=rootProject.file('src/main/resources/assets/justifylasers/textures/block/particle/'+(kind=='loot_collector'?'block_collection_module':kind)+'.png');particle.parentFile.mkdirs();ImageIO.write(top,'png',particle)
        }
        // Alpha lives in the texture, because vanilla Fabric's water renderer ignores tint alpha.
        ['still','flow'].each { state ->
            int width=state=='flow'?32:16
            def fluid=new BufferedImage(width,width*8,BufferedImage.TYPE_INT_ARGB)
            for(int frame=0;frame<8;frame++)for(int y=0;y<width;y++)for(int x=0;x<width;x++){
                int grey=(int)(225+12*Math.sin((x+y)*Math.PI/8+frame*Math.PI/4)+8*Math.cos(y*Math.PI/8-frame*Math.PI/4))
                fluid.setRGB(x,y+width*frame,204<<24|grey<<16|grey<<8|grey)
            }
            def target=rootProject.file('src/main/resources/assets/justifylasers/textures/block/photopolymer_'+state+'.png')
            ImageIO.write(fluid,'png',target)
            new File(target.path+'.mcmeta').setText('{"animation":{"frametime":16,"interpolate":true}}\n','UTF-8')
        }
    }
}
